<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠物分类器 - Oxford-IIIT Pet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: none;
            margin-bottom: 30px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background-color: #e9ecef;
        }
        .upload-area.dragover {
            border-color: #4CAF50;
            background-color: #e8f5e9;
        }
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .result-card {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .confidence-bar {
            height: 30px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }
        .confidence-fill {
            height: 100%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4CAF50;
            font-weight: bold;
            transition: width 0.5s;
        }
        .history-item {
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 标题卡片 -->
        <div class="card">
            <div class="card-header text-center">
                <h1 class="mb-0"><i class="bi bi-heart-pulse"></i> 宠物分类器</h1>
                <p class="mb-0 mt-2">基于EfficientNet-B2的Oxford-IIIT Pet 37类分类</p>
            </div>
        </div>

        <!-- 上传和预测卡片 -->
        <div class="card">
            <div class="card-body">
                <h3 class="mb-4"><i class="bi bi-upload"></i> 上传宠物图片</h3>
                
                <div class="upload-area" id="uploadArea">
                    <i class="bi bi-cloud-upload" style="font-size: 3rem; color: #667eea;"></i>
                    <p class="mt-3 mb-0">点击或拖拽图片到此处上传</p>
                    <p class="text-muted small">支持 JPG, PNG, JPEG 格式</p>
                </div>
                
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                
                <div id="previewContainer" style="display: none;">
                    <img id="previewImage" class="preview-image" alt="预览图片">
                    <div class="text-center">
                        <button class="btn btn-primary btn-lg" id="predictBtn">
                            <i class="bi bi-search"></i> 开始分类
                        </button>
                        <button class="btn btn-secondary btn-lg ms-2" id="resetBtn">
                            <i class="bi bi-arrow-counterclockwise"></i> 重新选择
                        </button>
                    </div>
                </div>
                
                <div id="loadingContainer" style="display: none;" class="text-center mt-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2">正在分析图片，请稍候...</p>
                </div>
                
                <div id="resultContainer" style="display: none;"></div>
            </div>
        </div>

        <!-- 历史记录卡片 -->
        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="mb-0"><i class="bi bi-clock-history"></i> 预测历史</h3>
                    <button class="btn btn-sm btn-outline-primary" id="refreshHistoryBtn">
                        <i class="bi bi-arrow-clockwise"></i> 刷新
                    </button>
                </div>
                <div id="historyContainer">
                    <p class="text-muted text-center">暂无历史记录</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const predictBtn = document.getElementById('predictBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loadingContainer = document.getElementById('loadingContainer');
        const resultContainer = document.getElementById('resultContainer');
        const historyContainer = document.getElementById('historyContainer');
        const refreshHistoryBtn = document.getElementById('refreshHistoryBtn');

        let currentFile = null;

        // 点击上传区域
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        // 处理文件
        function handleFile(file) {
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block';
                uploadArea.style.display = 'none';
                resultContainer.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // 重置
        resetBtn.addEventListener('click', () => {
            currentFile = null;
            fileInput.value = '';
            previewContainer.style.display = 'none';
            uploadArea.style.display = 'block';
            resultContainer.style.display = 'none';
        });

        // 预测
        predictBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            loadingContainer.style.display = 'block';
            resultContainer.style.display = 'none';
            predictBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    displayResult(data);
                    loadHistory(); // 刷新历史记录
                } else {
                    alert('预测失败，请重试');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('上传失败，请检查网络连接');
            } finally {
                loadingContainer.style.display = 'none';
                predictBtn.disabled = false;
            }
        });

        // 显示结果
        function displayResult(data) {
            const confidencePercent = (data.confidence * 100).toFixed(2);
            
            resultContainer.innerHTML = `
                <div class="result-card">
                    <h4><i class="bi bi-check-circle"></i> 预测结果</h4>
                    <h2 class="mt-3">${data.predicted_class}</h2>
                    <div class="confidence-bar mt-3">
                        <div class="confidence-fill" style="width: ${confidencePercent}%">
                            ${confidencePercent}%
                        </div>
                    </div>
                    <p class="mt-3 mb-0">
                        <small>置信度: ${confidencePercent}% | 预测ID: ${data.prediction_id}</small>
                    </p>
                </div>
            `;
            resultContainer.style.display = 'block';
        }

        // 加载历史记录
        async function loadHistory() {
            try {
                const response = await fetch('/history?limit=10');
                const data = await response.json();

                if (data.success && data.predictions.length > 0) {
                    historyContainer.innerHTML = data.predictions.map(pred => `
                        <div class="history-item">
                            <div class="row">
                                <div class="col-md-2">
                                    <img src="${pred.image_url || '/static/placeholder.png'}" 
                                         class="img-thumbnail" 
                                         style="max-width: 100px; max-height: 100px; object-fit: cover;"
                                         onerror="this.src='/static/placeholder.png'">
                                </div>
                                <div class="col-md-10">
                                    <h5>${pred.predicted_class}</h5>
                                    <p class="mb-1">
                                        <strong>置信度:</strong> ${(pred.confidence * 100).toFixed(2)}%
                                    </p>
                                    <p class="mb-0 text-muted small">
                                        <i class="bi bi-clock"></i> ${new Date(pred.upload_time).toLocaleString('zh-CN')}
                                    </p>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    historyContainer.innerHTML = '<p class="text-muted text-center">暂无历史记录</p>';
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        // 刷新历史记录
        refreshHistoryBtn.addEventListener('click', loadHistory);

        // 页面加载时获取历史记录
        loadHistory();
    </script>
</body>
</html>
